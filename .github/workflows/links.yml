name: Link check

on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  availability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live Pages availability
        shell: bash
        run: |
          for url in https://hivecommons.dev/ https://hivecommons.dev/stories/; do
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 5 "$url")
            if [[ "$status" != 200 ]]; then
              echo "::error::Live page $url returned HTTP $status (expected 200)"
              exit 1
            fi
            echo "$url returned HTTP $status"
          done

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check links
        run: scripts/check-links.sh --external-warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Self-test check-links
        run: scripts/check-links.test.sh
      - name: Self-test check-redirects
        run: scripts/check-redirects.test.sh
      - name: Self-test page scripts
        run: node --test scripts/story-dialog.test.mjs scripts/acmm-levels.test.mjs scripts/page-scripts.test.mjs

  redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check redirects
        run: scripts/check-redirects.sh
