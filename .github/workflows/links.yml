name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  availability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live Pages availability
        shell: bash
        run: |
          for url in https://hivecommons.dev/ https://hivecommons.dev/stories/ \
                     https://hivecommons.dev/docs/ https://hivecommons.dev/code/ \
                     https://hivecommons.dev/discord/ https://hivecommons.dev/join/ \
                     https://hivecommons.dev/404.html; do
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 5 "$url")
            if [[ "$status" != 200 ]]; then
              echo "::error::Live page $url returned HTTP $status (expected 200)"
              exit 1
            fi
            echo "$url returned HTTP $status"
          done

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        # PR/push: external breakage is a warning (third-party outages must not block
        # contributors). Weekly schedule / manual dispatch: external breakage fails
        # the run so link rot is actually surfaced.
        # The non-empty value must be on the `&&` side: `''` is falsy in Actions expressions.
        run: scripts/check-links.sh ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '--external-warn' || '' }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test check-links
        run: scripts/check-links.test.sh
      - name: Self-test check-redirects
        run: scripts/check-redirects.test.sh
      - name: Self-test page scripts
        run: node --test scripts/*.test.mjs

  redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check redirects
        run: scripts/check-redirects.sh
